# PROPOSED by the mapping agent -- review before use.
#
# KEY / SCOPE
# - In YAML, a bare No reads as boolean false, so the key is written as 'No' in quotes. BC No = EQData.dbo.Customer.CustomerID. CustomerID is unique in SS4, and No is unique in BC. 3,182 of 3,223 BC rows exist in SS4.
# - where ContractStatus = 'A', as the user instructed. This pairs 2,921 rows.
# - missing_in_ss4 = 302 (set to info). It has two parts:
#   (a) 41 BC numbers that are not in SS4 at all: district/internal codes (ACW, AME, CAN, DAL… named "Morrow Equipment Company, L.L.C."), TEMPLATE-CRANE, TESTPUSH1, INVALID, RENTMO, C000xx, PR000xx, 012026, and 1000-1003/1224.
#   (b) 261 BC customers whose SS4 row has ContractStatus 'C', blank or NULL. These fall outside the scope the user gave. A reviewer may want to confirm they should stay in BC.
# - missing_in_bc = 10,478 (set to info). These are active SS4 rows not in BC. All were created before 2026 (10,260 active, 158 Inactive=1, 60 from 2024-25). Every active row created on or after 2026-01-01, the push job's CreatedAfter scope, is in BC. If BC is expected to hold all active contracts, raise this to error.
# - source_of_truth: ss4. The push job writes SS4 values into BC. Customer.BcId and LastSyncedAt are filled on 297 of the 343 rows created in 2026.
#
# QUERY
# The query follows the push job's ReadCandidatesAsync: Customer LEFT JOIN CustSupp LEFT JOIN BillingInstructions. Each side table is unique on CustomerID, so the joins do not multiply rows. I removed the job's Inactive, CreateDate and watermark filters and used the scope the user gave instead. I did not add a filter for blank Name.
# The C# helpers are rewritten in SQL:
# - SplitAddress: Line1 is the text before the first line break. Rest is the remaining lines joined with ", ".
# - ParseCityStateZip: works on the last line. City is the text before the first comma, State is the next 2 letters (followed by a space or the end of the line), Zip is the rest. If the line does not have that shape, all three are NULL, as in the job's regex. This matches the regex closely but not exactly.
# - MapCountry: CA and MX variants are recognised; anything else becomes US.
# - Email: the first comma-separated address in ProjectEmail1.
# - Salesperson: SalesmanOne, trimmed and uppercased. EXCECUTIVE and EXEUTIVE become EXECUTIVE; POBANZ and 'POBANZ, J.' become POBANZ-J. The 'POBANZ, J.' mapping is the user's addition. Uppercasing is my own inference: BC codes are uppercase and SS4 has 'Morrow' and 'Mader'.
#
# FIELD EVIDENCE (paired rows, 2,921)
# - Address -> Line1: 98.1% agree. The 56 differences are mostly SS4 MailingAddress blank where BC has an address (15 rows), plus old 1xxx records.
# - Address_2 -> Rest: 84.8% agree. About 200 rows are blank in BC where SS4 has a second line, mostly numbers 14468-14999 (178). In that same range BC City, County and Post_Code are also blank, which looks like an import gap.
# - City: 90.7%. Post_Code: 88.6%. County vs parsed State: 79.9%.
#   CONTRADICTION: BC County matches TaxingState better (87.7%). For example, 15013 has a St. Louis, MO mailing address but County IL. The user's rule and the push job both say to use the mailing address, so County differences from the tax state will show up as findings.
# - Phone_No -> MailingTelephone: 88.8% agree. The alternative, BillingTelephone, matches only 1,433 rows.
# - Country: 89.1% agree. 276 rows are blank in BC. BC also holds codes that MapCountry cannot produce (BR, BS, BZ, DE, KY…; about 20 rows), and 21 BC 'CA' rows map to US in SS4.
# - Name: 68.1% overall, but 343/343 on rows created in 2026 (the push scope). On older rows, about 356 are BC truncated to 30 characters (they equal LEFT(Name,30)). The rest are wording changes on either side. Old 1xxx numbers (11 rows) hold entirely different companies in SS4, apparently reused numbers. I compared the full name, as the push does; truncation is not masked.
# - Name_2 -> ProjectName: 84.8%. Most differences are BC blank (349 rows).
# - E_Mail -> first ProjectEmail1: 31.4% overall, but 343/343 on 2026 rows. Older rows were evidently loaded from another source: BC holds ';'-separated lists and different addresses. I checked billingemail, ProjectEmail2 and ShippingEmail in vwCustomerInquiry and none fit better (102 / 2 / 278 matches). Mapped because the push job defines it and agreement is exact within its scope. Expect about 2,000 findings on older rows.
# - ContactName -> MailingContact: 76.3% overall. Where both sides are filled, 1,869 of 1,870 agree. Most differences are BC blank where SS4 has a contact (311 of the 2026 rows and 324 older rows). The push job does not send a contact to the customer, so the BC blanks on 2026 rows are probably by design. I left them compared rather than setting bc_blank: ignore. Also, 43 BC rows hold the literal text 'NULL'.
# - Salesperson_Code: 85.1%. Nearly all differences are BC blank where SS4 has a salesman (Morrow 73, Toner 50, Mairn 38…). About 15 are real disagreements. 'R.Benck', 'Regal', 'McGregor', 'Maurer' and 'Clayson' have no fix-up, so they will differ if BC lacks those codes.
#
# NOT MAPPED
# Fax_No: no column agrees well. Search_Name: BC derives it from Name. Balances and statistics: computed by BC. Details for each are in the ignored list.
#
# ADDED AFTER REVIEW
# Scope also excludes customers flagged Inactive in SS4 and customers with no name (the push job
# skips both), at the user's decision.
#
# Global_Dimension_1_Code (DISTRICT) <- EQData.dbo.Customer.District, the 3-letter district code
# (filled on all but 6 in-scope customers; agrees with ARCustSupp.District 99% where both are set).
# Customer_Card_Excel does not expose this field, so check.py will show it as blank in BC; the
# template fill is what it is for. Global Dimension 2 (PROJECT) is set on projects, not customers.
#
# Country_Region_Code: the push job's rule recognises only Canada and Mexico and turns every other
# country into US, which put about 114 foreign customers of the US company (Brazil, Dominican Republic,
# Bahamas...) under US. Each SS4 country, misspellings included, now maps to its two-letter code; blank
# or US variants stay US. Netherlands Antilles and West Indies (2 customers each) have no clean code
# and are left blank rather than given a wrong one.
#
# Scope: active customers of SS4 companies 01 (US) and 15 (Canada) only, via ARData.dbo.customer's
# customer_company_code. Canada is a posting group in this BC company, not a separate company.
# Australia (70), Mexico (90) and New Zealand (60) customers belong to other BC companies.
#
# Customer_Posting_Group, by company and currency:
#   15 + EUR -> CAN-EURO, 15 -> CANADA, 01 + EUR -> EURO, 01 -> DOMESTIC.
# By company, not by address: company 01 bills some Canadian-located customers in USD, and those
# stay DOMESTIC.
#
# Currency_Code: blank for USD (the company's own currency), otherwise CustSupp.CurrencyType (CAD, EUR).
#
# Address_2 (the query's Rest column): a two-line address keeps line 2, as before. A three-or-more-line
# address now takes only the MIDDLE lines, leaving out the last city/state/ZIP line, which City, County
# and Post_Code already hold. Joining every line after the first (the push job's rule) overflowed BC's
# 50-character Address 2 on 333 customers; UAT itself holds only the middle line for those addresses.
#
# Payment_Terms_Code <- BillingInstructions.PMTTerms, spaces removed and uppercased ('NET 30' -> 'NET30'), the
# push job's MapPaymentTerms rule. Claude had left it unmapped because UAT holds NET30 on 94% of customers, but
# SS4 also has NET 45/60/90 terms, and those should carry into prod. Expect differences against UAT's NET30 values.
# ARData.dbo.BC_Customers looks like a replica pulled from BC. It was not used as the SS4 side.

name: customers_card
description: BC Customer Card (Excel page) vs EQData.dbo.Customer (active contracts), with email from CustSupp and salesperson from BillingInstructions, per BcCustomerPushJob
source_of_truth: ss4
bc:
  target: BC
  api: odata
  entity: Customer_Card_Excel
  key: ['No']
ss4:
  query: >-
    SELECT x.CustomerID, x.ContractStatus, x.CreateDate, x.Name, x.ProjectName,
           x.Line1, x.Rest, x.MailingTelephone, x.MailingContact,
           x.Email, x.Salesperson, x.Country, x.PaymentTerms,
           x.CompanyCode, x.CustomerPostingGroup, x.CurrencyCode,
           x.Inactive, x.District,
           CASE WHEN x.Ok = 1 THEN LTRIM(RTRIM(LEFT(x.LastLine, CHARINDEX(',', x.LastLine) - 1))) END AS City,
           CASE WHEN x.Ok = 1 THEN LEFT(x.AfterComma, 2) END AS State,
           CASE WHEN x.Ok = 1 THEN NULLIF(LTRIM(RTRIM(SUBSTRING(x.AfterComma, 3, 400))), '') END AS Zip
      FROM (
        SELECT y.*,
               CASE WHEN CHARINDEX(',', y.LastLine) > 1
                     AND (y.AfterComma LIKE '[A-Za-z][A-Za-z]' OR y.AfterComma LIKE '[A-Za-z][A-Za-z] %')
                    THEN 1 ELSE 0 END AS Ok
          FROM (
            SELECT z.*,
                   LTRIM(SUBSTRING(z.LastLine, CHARINDEX(',', z.LastLine) + 1, 400)) AS AfterComma
              FROM (
                SELECT c.CustomerID, c.ContractStatus, c.CreateDate, c.Name, c.ProjectName,
                       ISNULL(c.Inactive, 0) AS Inactive, NULLIF(LTRIM(RTRIM(c.District)), '') AS District,
                       c.MailingTelephone, c.MailingContact,
                       NULLIF(LTRIM(RTRIM(LEFT(s.ProjectEmail1, CHARINDEX(',', s.ProjectEmail1 + ',') - 1))), '') AS Email,
                       CASE UPPER(LTRIM(RTRIM(ISNULL(c.TaxingCountry, ''))))
                            WHEN '' THEN 'US' WHEN 'US' THEN 'US' WHEN 'USA' THEN 'US' WHEN 'UNITED STATES' THEN 'US'
                            WHEN 'CA' THEN 'CA' WHEN 'CAN' THEN 'CA' WHEN 'CANADA' THEN 'CA'
                            WHEN 'MX' THEN 'MX' WHEN 'MEX' THEN 'MX' WHEN 'MEXICO' THEN 'MX'
                            WHEN 'BRAZIL' THEN 'BR' WHEN 'DOMINICAN REPUBLIC' THEN 'DO'
                            WHEN 'VENEZUELA' THEN 'VE' WHEN 'VENUZUELA' THEN 'VE'
                            WHEN 'BAHAMAS' THEN 'BS' WHEN 'GRAND BAHAMA' THEN 'BS'
                            WHEN 'PERU' THEN 'PE' WHEN 'CHILE' THEN 'CL' WHEN 'COSTA RICA' THEN 'CR' WHEN 'ECUADOR' THEN 'EC'
                            WHEN 'CAYMEN ISLANDS' THEN 'KY' WHEN 'CAYMAN ISLANDS' THEN 'KY' WHEN 'GRAND CAYMAN' THEN 'KY'
                            WHEN 'THE NETHERLANDS' THEN 'NL' WHEN 'NETHERLANDS' THEN 'NL' WHEN 'THE NEATHERLANDS' THEN 'NL'
                            WHEN 'PANAMA' THEN 'PA' WHEN 'GUAM' THEN 'GU' WHEN 'HONDURAS' THEN 'HN' WHEN 'BERMUDA' THEN 'BM'
                            WHEN 'GUATEMALA' THEN 'GT' WHEN 'NEW ZEALAND' THEN 'NZ' WHEN 'PUERTO RICO' THEN 'PR'
                            WHEN 'SOUTH KOREA' THEN 'KR' WHEN 'GERMANY' THEN 'DE' WHEN 'PHILIPPINES' THEN 'PH'
                            WHEN 'BRITISH VIRGIN ISLANDS' THEN 'VG' WHEN 'NIGERIA' THEN 'NG' WHEN 'BELIZE' THEN 'BZ'
                            ELSE NULL END AS Country,
                       UPPER(CASE UPPER(LTRIM(RTRIM(b.SalesmanOne))) WHEN 'EXCECUTIVE' THEN 'EXECUTIVE' WHEN 'EXEUTIVE' THEN 'EXECUTIVE'
                            WHEN 'POBANZ' THEN 'POBANZ-J' WHEN 'POBANZ, J.' THEN 'POBANZ-J' ELSE LTRIM(RTRIM(b.SalesmanOne)) END) AS Salesperson,
                       NULLIF(UPPER(REPLACE(LTRIM(RTRIM(b.PMTTerms)), ' ', '')), '') AS PaymentTerms,
                       a.customer_company_code AS CompanyCode,
                       CASE WHEN a.customer_company_code = '15' AND UPPER(LTRIM(RTRIM(s.CurrencyType))) = 'EUR' THEN 'CAN-EURO'
                            WHEN a.customer_company_code = '15' THEN 'CANADA'
                            WHEN UPPER(LTRIM(RTRIM(s.CurrencyType))) = 'EUR' THEN 'EURO'
                            ELSE 'DOMESTIC' END AS CustomerPostingGroup,
                       CASE WHEN UPPER(LTRIM(RTRIM(ISNULL(s.CurrencyType, '')))) IN ('', 'USD') THEN NULL
                            ELSE UPPER(LTRIM(RTRIM(s.CurrencyType))) END AS CurrencyCode,
                       CASE WHEN CHARINDEX(CHAR(10), c.MailingAddress) > 0
                            THEN LTRIM(RTRIM(REPLACE(LEFT(c.MailingAddress, CHARINDEX(CHAR(10), c.MailingAddress) - 1), CHAR(13), '')))
                            ELSE LTRIM(RTRIM(c.MailingAddress)) END AS Line1,
                       CASE WHEN CHARINDEX(CHAR(10), c.MailingAddress) = 0 THEN NULL
                            WHEN DATALENGTH(c.MailingAddress) / 2 - CHARINDEX(CHAR(10), REVERSE(c.MailingAddress)) + 1 = CHARINDEX(CHAR(10), c.MailingAddress)
                            THEN LTRIM(RTRIM(REPLACE(SUBSTRING(c.MailingAddress, CHARINDEX(CHAR(10), c.MailingAddress) + 1, 4000), CHAR(13), '')))
                            ELSE LTRIM(RTRIM(REPLACE(REPLACE(SUBSTRING(c.MailingAddress, CHARINDEX(CHAR(10), c.MailingAddress) + 1,
                                     (DATALENGTH(c.MailingAddress) / 2 - CHARINDEX(CHAR(10), REVERSE(c.MailingAddress)) + 1) - CHARINDEX(CHAR(10), c.MailingAddress) - 1),
                                     CHAR(13), ''), CHAR(10), ', ')))
                            END AS Rest,
                       CASE WHEN CHARINDEX(CHAR(10), c.MailingAddress) > 0
                            THEN LTRIM(RTRIM(REPLACE(RIGHT(c.MailingAddress, CHARINDEX(CHAR(10), REVERSE(c.MailingAddress)) - 1), CHAR(13), '')))
                            END AS LastLine
                  FROM EQData.dbo.Customer c
                  LEFT JOIN EQData.dbo.CustSupp s ON s.CustomerID = c.CustomerID
                  LEFT JOIN EQDataCor.dbo.BillingInstructions b ON b.CustomerID = c.CustomerID
                  LEFT JOIN ARData.dbo.customer a ON a.customer_number = c.CustomerID
              ) z
          ) y
      ) x
  key: [CustomerID]
  where: ContractStatus = 'A' AND CompanyCode IN ('01', '15') AND Inactive = 0 AND NULLIF(LTRIM(RTRIM(Name)), '') IS NOT NULL
