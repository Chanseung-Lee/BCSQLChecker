# PROPOSED by the mapping agent -- review before use.
#
# SCOPE
# - BC: the SOV import fills only Job_Task_No 9500 (7,967 rows, 303 jobs). Every line there has the same Line_Type (Billable), Type (G/L Account), User_ID and planning date pattern. The other tasks (1000/2000/2100/4000...) come from other imports or were entered by hand. Hence bc.filter Job_Task_No eq '9500'.
# - SS4: I adapted the population query from sov_planning_lines.sql: turned the CTEs into nested SELECTs, removed ORDER BY and NOLOCK, and kept the aliases.
# - CONTRADICTION WITH THE SOURCE FILE: the file filters on `d.Units <> 0 AND NewContractAmount <> 0`, which leaves 2,603 rows. BC holds all SOV items, including zero-unit rate lines: without the filter SS4 has 8,010 rows across 305 jobs, against BC's 7,967 across 303. I dropped the WHERE clause. Either the script that actually ran differed from this SQL, or the filter was applied differently. Please confirm.
#
# KEY
# - Job_No + Description, matched to customer_id + trimmed WorkDesc. Line_No is generated by the import (10000, 20000...), so I did not use it. 7,975 rows pair.
# - 4 job+description pairs are duplicated on both sides: 17002 'Dismantle Tech Weekday OT', 17565 'Erect Tech OT/Saturday', 17641 and 17679 'Inspection Weekday'. Each pair has two different rates. Because the key cannot tell the two lines apart, they can pair crosswise, and that causes the 8 remaining Unit_Price differences. Those are artifacts of the key, not real differences. I did not add rate to the key because then a price change would show up as a missing row plus an extra row.
#
# FIELDS (agreement on 7,975 paired rows)
# - No -> ARBilling.Account2 via BillAsCode (company 01): 99.46%. All 43 differences have a blank SS4 value and BC '33105'. In 18 of those rows the BillAsCode has no ARBilling row at all; in the others Account2 is blank. It looks like the import fell back to 33105, but I inferred that and did not check it. Examples are on job 16621 ('Metered Overages - Rent', 'Camera per crane', 'Anti-Collision').
# - Quantity: 100% with a computed column. When ChangeOrdersTotal <> 0 the line went in as quantity 1 at the NewContractAmount, otherwise Units at Rate. I worked this rule out from the data (e.g. 17562/17563 operator lines, 17116 Anchors, 17704 lump sums); it is not in the SQL file and probably lives in the Python. Using raw Units gives 99.92%.
# - Unit_Price: 99.90% with the same rule (99.69% with raw Rate). The 8 differences are the duplicate-key cross-pairs described above.
# - Line_Amount = NewContractAmount: 100%.
# - Planning_Date: 99.87% with a computed rule. Dismantle codes (FRO, DLST, DLSM, DSTR, DPD, DLSWD, LMPD) get Customer.DismantleDate. Erect codes (FRI, ELST, ELSM, ANC) get ErectionDate when it falls after 2026-10-30. Everything else gets 2026-10-30. I worked out these code lists from the data, and they may be incomplete for codes that never had a non-default date. The 10 differences are dismantle lines where BC's date no longer matches SS4's current DismantleDate: 17661 (BC 2026-12-31, SS4 2026-11-16), 17393, 17600 and 17245. SS4 dismantle dates have probably changed since the import; that is inferred, not verified.
# - Planned_Delivery_Date, Currency_Date, Quantity_Base, Qty_to_Invoice, Qty_to_Transfer_to_Invoice, *_LCY and Total_Price*: I checked that these equal their mapped twin on every task-9500 row. They are listed as ignored to avoid comparing the same column twice.
# - Qty_Transferred_to_Invoice: 0 on every in-scope row. The SS4 billed-to-date value is an amount, not a quantity, so I did not map it.
#
# MISSING
# - missing_in_bc: 43 rows. 29 are all of job 17912's latest SOV, and BC has no lines for that job at all. The other 14 belong to one more in-scope job with no task-9500 lines in BC (305 jobs in SS4 vs 303 in BC). Both are set to error. Note that the scope depends on today's SS4 data (latest invoice, contract status, latest SOV), so contracts that change after 2026-10-30 will drift in or out of scope.
# - missing_in_ss4: 0 in the test run.

name: Job_Planning_Lines_sql
description: BC SOV planning lines (job task 9500, RENT-PLANLINES import) vs SS4 latest SOV items of current rent contracts (company 01, as of 2026-10-30)
source_of_truth: ss4
bc:
  target: BC
  api: odata
  entity: Job_Planning_Lines
  key: [Job_No, Description]
  filter: Job_Task_No eq '9500'
ss4:
  query: >-
    SELECT cur.CustomerID AS customer_id, cur.ErectionDate AS erection_date, cur.DismantleDate AS dismantle_date,
           s.PKID AS sov_id, d.PKID AS item_id, d.SOVItemNumber AS item_no,
           LTRIM(RTRIM(ISNULL(d.WorkDesc, ''))) AS work_desc, LTRIM(RTRIM(ISNULL(d.BillAsCode, ''))) AS code,
           d.Units AS units, ISNULL(d.UnitsDefinition, '') AS units_def, CAST(d.Rate AS decimal(19, 4)) AS rate,
           CAST(ISNULL(d.ChangeOrdersTotal, 0) AS decimal(19, 4)) AS change_orders,
           CAST(d.NewContractAmount AS decimal(19, 4)) AS contract_amount,
           CAST(ISNULL(d.WorkFromPrevApp, 0) AS decimal(19, 4)) AS sov_billed, d.Billable AS billable,
           LTRIM(RTRIM(ISNULL(b.Account2, ''))) AS ss4_gl,
           CASE WHEN ISNULL(d.ChangeOrdersTotal, 0) <> 0 THEN 1 ELSE d.Units END AS bc_quantity,
           CASE WHEN ISNULL(d.ChangeOrdersTotal, 0) <> 0 THEN CAST(d.NewContractAmount AS decimal(19, 4)) ELSE CAST(d.Rate AS decimal(19, 4)) END AS bc_unit_price,
           CASE WHEN LTRIM(RTRIM(d.BillAsCode)) IN ('FRO','DLST','DLSM','DSTR','DPD','DLSWD','LMPD') THEN CAST(cur.DismantleDate AS date)
                WHEN LTRIM(RTRIM(d.BillAsCode)) IN ('FRI','ELST','ELSM','ANC') AND cur.ErectionDate > '2026-10-30' THEN CAST(cur.ErectionDate AS date)
                ELSE CAST('2026-10-30' AS date) END AS planning_date
      FROM (SELECT ri.CustomerID, c.ErectionDate, c.DismantleDate
              FROM (SELECT LTRIM(RTRIM(i.CustomerID)) AS CustomerID, i.InvoiceDate,
                           ROW_NUMBER() OVER (PARTITION BY LTRIM(RTRIM(i.CustomerID)) ORDER BY i.InvoiceDate DESC, i.InvoiceID DESC) AS rn
                      FROM ARData.dbo.ARInvoice i
                     WHERE i.Company = '01' AND i.[Type] IN ('R', 'A') AND i.ProcessStatus = 'FINISHED'
                       AND EXISTS (SELECT 1 FROM ARData.dbo.ARInvoiceDetail x WHERE x.InvoiceID = i.InvoiceID AND x.Item = 1 AND x.Quantity <> 0 AND x.Code = 'RNT')) ri
              JOIN EQData.dbo.Customer c ON LTRIM(RTRIM(c.CustomerID)) = ri.CustomerID
             WHERE ri.rn = 1 AND ri.InvoiceDate >= '2026-09-01' AND c.DismantleDate > '2026-10-30' AND c.ContractStatus = 'A') cur
      JOIN (SELECT s0.PKID, s0.ARID, ROW_NUMBER() OVER (PARTITION BY LTRIM(RTRIM(s0.ARID)) ORDER BY s0.PKID DESC) AS sov_rank
              FROM SAPData.dbo.maSOV s0) s ON LTRIM(RTRIM(s.ARID)) = cur.CustomerID AND s.sov_rank = 1
      JOIN SAPData.dbo.maSOVDetails d ON d.SOVID = s.PKID
      LEFT JOIN ARData.dbo.ARBilling b ON b.Company = '01' AND b.Code = d.BillAsCode
  key: [customer_id, work_desc]
missing:
  in_bc: error
  in_ss4: error
fields:
  - bc: "No"
    ss4: ss4_gl
    type: text
  - bc: Quantity
    ss4: bc_quantity
    type: decimal
  - bc: Unit_Price
    ss4: bc_unit_price
    type: decimal
  - bc: Line_Amount
    ss4: contract_amount
    type: decimal
  - bc: Planning_Date
    ss4: planning_date
    type: date
ignored:
  - bc: Line_No
    reason: generated by the import (10000 steps per job); SS4 has no counterpart. Key uses Job_No + Description instead
  - bc: Job_Task_No
    reason: constant 9500 within scope (used as bc.filter)
  - bc: Line_Type
    reason: constant 'Billable' within scope
  - bc: Type
    reason: constant 'G/L Account' within scope
  - bc: Usage_Link
    reason: constant (False) within scope
  - bc: Contract_Line
    reason: constant True within scope
  - bc: Planned_Delivery_Date
    reason: equals Planning_Date on every task-9500 row (verified); Planning_Date is compared
  - bc: Currency_Date
    reason: equals Planning_Date on every task-9500 row (verified); Planning_Date is compared
  - bc: Quantity_Base
    reason: equals Quantity on every task-9500 row (verified); Quantity is compared
  - bc: Qty_to_Invoice
    reason: equals Quantity on every task-9500 row (verified)
  - bc: Qty_to_Transfer_to_Invoice
    reason: equals Quantity on every task-9500 row (verified)
  - bc: Unit_Price_LCY
    reason: equals Unit_Price on every task-9500 row (verified)
  - bc: Line_Amount_LCY
    reason: equals Line_Amount on every task-9500 row (verified)
  - bc: Total_Price
    reason: equals Line_Amount on every task-9500 row (verified)
  - bc: Total_Price_LCY
    reason: equals Line_Amount on every task-9500 row (verified)
  - bc: Qty_Transferred_to_Invoice
    reason: always 0 in scope; SS4 WorkFromPrevApp (sov_billed) is a billed AMOUNT not a quantity and was not loaded into this field (88.65% 'agreement' was only zeros)
  - bc: Gen_Prod_Posting_Group
    reason: BC default from the G/L account; no SS4 counterpart
  - bc: Gen_Bus_Posting_Group
    reason: sparse BC posting setup; no SS4 counterpart
  - bc: Tax_Group_Code
    reason: sparse, constant within scope; BC setup
  - bc: Price_Calculation_Method
    reason: constant BC setting
  - bc: Cost_Calculation_Method
    reason: constant BC setting
  - bc: ReserveName
    reason: BC setting, effectively constant
  - bc: User_ID
    reason: BC user who ran the import; constant within scope
  - bc: Job_Contract_Entry_No
    reason: BC-generated sequence
  - bc: Overdue
    reason: BC-calculated flag
  - bc: Description_2
    reason: sparse, constant (blank) within scope
  - bc: Location_Code
    reason: sparse, not in scope
  - bc: Bin_Code
    reason: sparse, not in scope
  - bc: Unit_of_Measure_Code
    reason: blank within scope; SS4 UnitsDefinition (Months/Lump Sum/Hours) was not loaded
  - bc: Remaining_Qty
    reason: sparse, BC-calculated; constant within scope
  - bc: Qty_to_Transfer_to_Journal
    reason: sparse, BC-calculated
  - bc: Qty_Invoiced
    reason: sparse, BC posting result
  - bc: Invoiced_Amount_LCY
    reason: sparse, BC posting result
  - bc: Invoiced_Cost_Amount_LCY
    reason: sparse, BC posting result
  - bc: Direct_Unit_Cost_LCY
    reason: sparse, cost fields not part of the SOV import
  - bc: Unit_Cost
    reason: sparse, cost fields not part of the SOV import
  - bc: Unit_Cost_LCY
    reason: sparse, cost fields not part of the SOV import
  - bc: Total_Cost
    reason: sparse, cost fields not part of the SOV import
  - bc: Total_Cost_LCY
    reason: sparse, cost fields not part of the SOV import
  - bc: Remaining_Total_Cost
    reason: sparse, BC-calculated
  - bc: Remaining_Total_Cost_LCY
    reason: sparse, BC-calculated
  - bc: Remaining_Line_Amount
    reason: sparse, BC-calculated
  - bc: Remaining_Line_Amount_LCY
    reason: sparse, BC-calculated
  - bc: Document_No
    reason: empty in BC
  - bc: Variant_Code
    reason: empty in BC
  - bc: Work_Type_Code
    reason: empty in BC
  - bc: Qty_to_Assemble
    reason: empty in BC
  - bc: Reserved_Quantity
    reason: empty in BC
  - bc: Line_Discount_Amount
    reason: empty in BC
  - bc: Line_Discount_Percent
    reason: empty in BC
  - bc: Qty_Posted
    reason: empty in BC
  - bc: Posted_Total_Cost
    reason: empty in BC
  - bc: Posted_Total_Cost_LCY
    reason: empty in BC
  - bc: Posted_Line_Amount
    reason: empty in BC
  - bc: Posted_Line_Amount_LCY
    reason: empty in BC
  - bc: Serial_No
    reason: empty in BC
  - bc: Lot_No
    reason: empty in BC
  - bc: Ledger_Entry_Type
    reason: empty in BC
  - bc: Ledger_Entry_No
    reason: empty in BC
  - bc: System_Created_Entry
    reason: empty in BC
  - bc: Qty_Picked
    reason: empty in BC
  - bc: Qty_Picked_Base
    reason: empty in BC
  - ss4: sov_billed
    reason: billed-to-date amount from the SOV; BC Qty_Transferred_to_Invoice is a quantity and is 0 on every in-scope row
