  - {bc: Unit_Cost, reason: empty within task 9500 scope}
  - {bc: Unit_Cost_LCY, reason: empty within task 9500 scope}
  - {bc: Total_Cost, reason: empty within task 9500 scope}
  - {bc: Total_Cost_LCY, reason: empty within task 9500 scope}
  - {bc: Remaining_Total_Cost, reason: empty within task 9500 scope}
  - {bc: Remaining_Total_Cost_LCY, reason: empty within task 9500 scope}
  - {bc: Remaining_Line_Amount, reason: empty within task 9500 scope}
  - {bc: Remaining_Line_Amount_LCY, reason: empty within task 9500 scope}
  - {bc: Qty_Invoiced, reason: "empty within task 9500 scope; BC posting state, not imported"}
  - {bc: Qty_Transferred_to_Invoice, reason: "0 on all 9500 lines; BC invoicing state, not imported"}
  - {bc: Invoiced_Amount_LCY, reason: empty within task 9500 scope; BC posting state}
  - {bc: Invoiced_Cost_Amount_LCY, reason: empty within task 9500 scope; BC posting state}
  - {bc: Overdue, reason: empty within task 9500 scope; BC-computed flag}
  - {bc: Price_Calculation_Method, reason: "constant in BC (BC default 'Lowest Price')"}
  - {bc: Cost_Calculation_Method, reason: "constant in BC (BC default 'Lowest Price')"}
  - {bc: ReserveName, reason: "constant in BC within scope ('Never', BC default)"}
  - {bc: Contract_Line, reason: constant True in scope; BC sets it for Billable lines}
  - {bc: Gen_Bus_Posting_Group, reason: "BC fills from the project's customer (69 of 994 rows 'DOMESTIC'); no ss4 source in the import"}
  - {bc: Gen_Prod_Posting_Group, reason: "BC fills it from the G/L account (No), which is compared; the import does not set it"}
  - {bc: User_ID, reason: "BC user who ran the import (C.LEE on all 994); no ss4 counterpart"}
  - {bc: Job_Contract_Entry_No, reason: "BC-assigned sequence number; no ss4 counterpart"}
