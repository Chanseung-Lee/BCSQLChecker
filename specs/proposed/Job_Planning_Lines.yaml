  - {bc: Variant_Code, reason: empty in BC}
  - {bc: Work_Type_Code, reason: empty in BC}
  - {bc: Qty_to_Assemble, reason: empty in BC}
  - {bc: Reserved_Quantity, reason: empty in BC}
  - {bc: Line_Discount_Amount, reason: empty in BC}
  - {bc: Line_Discount_Percent, reason: empty in BC}
  - {bc: Qty_Posted, reason: empty in BC}
  - {bc: Posted_Total_Cost, reason: empty in BC}
  - {bc: Posted_Total_Cost_LCY, reason: empty in BC}
  - {bc: Posted_Line_Amount, reason: empty in BC}
  - {bc: Posted_Line_Amount_LCY, reason: empty in BC}
  - {bc: Serial_No, reason: empty in BC}
  - {bc: Lot_No, reason: empty in BC}
  - {bc: Ledger_Entry_Type, reason: empty in BC}
  - {bc: Ledger_Entry_No, reason: empty in BC}
  - {bc: System_Created_Entry, reason: empty in BC}
  - {bc: Qty_Picked, reason: empty in BC}
