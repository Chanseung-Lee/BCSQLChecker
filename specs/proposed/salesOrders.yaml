# PROPOSED by the mapping agent -- review before use.
#
# TABLE: SAPData.dbo.BC_SalesOrder is a sync copy of BC sales orders. It stores the BC GUID (Id), CompanyId, LastSyncedAt/FirstSeenAt/LastSeenAt, and soft-delete and archive columns, so source_of_truth = bc. Other tables were looked at by name: IMData.dbo.SO/NewSO (legacy SO tables) and SAPData.BC_SalesOrderLine/Dimension (line and dimension tables, not headers). Their contents were not tested, because BC_SalesOrder matched on the GUID itself.
#
# KEY: Number <-> number. Number is unique in SS4 (123 rows, 123 distinct). For all 100 paired rows, Id also equals the BC id.
#
# SCOPE: where IsDeleted = 0. SS4 has only one CompanyId (C463254A-...). Of the 123 SS4 rows, 23 have IsDeleted = 1: 21 of them also carry archive info (ArchiveVersionNo set) and 2 do not. None of those 23 numbers is in BC, so they are deleted or archived history and outside this BC table. The 100 rows with IsDeleted = 0 all pair with BC.
#
# FINDING, missing_in_ss4 = 47: BC orders S-ORD101148 and S-ORD101150 through S-ORD101197 have no row in SS4. Their order dates run 2026-11-02 to 2026-11-12, except S-ORD101183, dated 2026-07-15. The highest Number in SS4 is S-ORD101147. Max LastSyncedAt is 2026-11-10 22:30, while max LastSeenAt is 2026-11-12 16:00. Several missing orders were last modified in BC before 2026-11-10 22:30 (e.g. S-ORD101151, modified 2026-11-03). So "created after the last sync" does not fully explain the gap. I have not investigated the cause. The rule is set to error because these rows should have arrived.
#
# FIELDS: all 47 mapped fields agree 100% on the 100 paired rows (check_spec). For the sparse fields, the agreement on filled rows is: externalDocumentNumber 6 of 6, requestedDeliveryDate 4 of 4, shortcutDimension2Code 2 of 2, currencyId 5 of 5, non-USD currencyCode 5 of 5, non-zero totalTaxAmount 4 of 4. Those counts are small, but the column names match directly.
#
# paymentTermsId and shipmentMethodId are GUIDs of BC lookup records. BC has no code field for them, and SS4 stores the same GUIDs, so they are compared as guid. Every column is compared with no transformation. status is compared as enum (BC sends 'In_x0020_Review' for 'In Review').
#
# IGNORED: pricesIncludeTax and discountAmount are empty in BC. partialShipping is constant 'True' in BC.

name: salesOrders
