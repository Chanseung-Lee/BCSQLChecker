# PROPOSED by the mapping agent -- review before use.
#
# TABLE: SAPData.dbo.BC_SalesOrder. It is a sync copy of BC: it stores BC GUIDs (Id, CustomerId and others) plus sync columns (CompanyId, LastSyncedAt, IsDeleted, FirstSeenAt, LastSeenAt, archive columns). So source_of_truth is bc. I found no other candidate. IMData.dbo.SO, SODetail and similar tables are the old SS4 order system, not this BC entity.
#
# KEY: number = Number. Number is unique in SS4 (123 distinct out of 123 rows) and none are blank. On all 100 pairs, Id also matches the BC id.
#
# SCOPE: where IsDeleted = 0. SS4 holds 123 rows, all with one CompanyId. All 100 rows that match BC have IsDeleted=0. The other 23 have IsDeleted=1, and their LastSeenAt dates run from 2026-09-22 to 2026-10-28. These look like orders deleted in BC or turned into something else. I infer this from the sync flags and did not check it in BC. They are outside the scope of the current BC table, so I excluded them.
#
# MAIN FINDING: 41 BC orders are missing from SS4 (marked error). They are S-ORD101148 to S-ORD101191, and SS4's highest number is S-ORD101147. The newest FirstSeenAt in SS4 is 2026-11-02 21:30. Existing rows are still being updated (LastSeenAt 2026-11-11 22:30, LastSyncedAt up to 2026-11-10). So the sync appears to have stopped inserting new orders after about 2026-11-02 while it still updates existing ones. That is my inference from these timestamps; I have not seen the sync job.
#
# FIELD AGREEMENT (100 paired rows):
# - 100% on id, the dates, customer and bill-to ids/numbers/names, shipToName/Contact, city/state/postcode/country for all three addresses, the dimensions, currency, paymentTermsId, shipmentMethodId, salesperson, the totals, the bool flags, phone and email.
# - Several fields are mostly blank or dominated by one value, so their evidence rests on few rows: externalDocumentNumber (6 filled rows), requestedDeliveryDate (4), shortcutDimension2Code (2), currencyId/currencyCode (5 non-default), totalTaxAmount (4 non-zero). All of these agree.
# - *AddressLine1: 91% agree. *AddressLine2: 94% agree. Every difference is a trailing line feed (CHAR(10)) in SS4 that BC does not have. I checked that #bc_raw has no trailing CR/LF on these rows. I don't know whether BC's API trims it or the SS4 copy is stale. The fields are kept mapped and the 9+6 rows per address type show up as findings.
# - status: 98% agree. The 2 differences are BC 'In_x0020_Review' vs SS4 'In Review'. That is the same enum value; BC's export shows the space XML-escaped as _x0020_. They will appear as differences because the spec has no transform for this. The reviewer may want a value map.
# - lastModifiedDateTime: ignored. It matches exactly in SQL, but the diff engine drops BC's milliseconds (see the reason in the spec).
#
# NOT MAPPED: the GUID lookup ids (paymentTermsId, shipmentMethodId, currencyId) are mapped directly because SS4 stores the same GUIDs. BC exposes no code fields for payment terms or shipment method.

name: salesOrders
description: BC sales orders vs SAPData BC_SalesOrder (SS4 sync copy of BC salesOrders)
source_of_truth: bc
bc:
  target: BC
  api: standard
  entity: salesOrders
  key: [number]
ss4:
  database: SAPData
  table: dbo.BC_SalesOrder
  key: [Number]
  where: IsDeleted = 0
missing:
  in_bc: error
  in_ss4: error
fields:
